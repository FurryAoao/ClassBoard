[package]
name = "classboard"
version = "2.9.0"
description = "师者屏隅轻辅，悬停即启，一窗百用，默认唯时，诸能可择。"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-opener = { version = "2" }
tauri-plugin-global-shortcut = { version = "2" }
tauri-plugin-dialog = { version = "2" }
tauri-plugin-fs = { version = "2" }
tauri-plugin-autostart = { version = "2" }
tauri-plugin-single-instance = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
